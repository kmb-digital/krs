<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  KRS 2.0 (KMB Reservation System) — halaman GitHub
  Sistem Apps Script dipaparkan DI DALAM halaman ini (iframe), jadi banner
  "This application was created by a Google Apps Script user" tidak muncul.
  Jika pautan sistem bertukar, gantikan APP_URL di bawah (pautan yang berakhir dengan /exec).
-->
<title>KRS 2.0 — KMB Reservation System</title>
<meta name="description" content="Semak kalendar, tempah dewan, bilik dan kenderaan Kolej MARA Banting, dan pantau status kelulusan.">
<meta name="theme-color" content="#1f2a44">

<!-- Pratonton pautan (WhatsApp, Telegram, Facebook, Teams) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kolej MARA Banting">
<meta property="og:title" content="KRS 2.0 — KMB Reservation System">
<meta property="og:description" content="Semak kalendar, tempah dewan, bilik dan kenderaan, dan pantau status kelulusan.">
<meta property="og:url" content="https://kmb-digital.github.io/krs">
<meta property="og:image" content="https://kmb-digital.github.io/krs/og-krs.png">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary">
<link rel="icon" href="og-krs.png">

<style>
  html,body{margin:0;height:100%;background:#1f2a44;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#faf6ee}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#faf6ee;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#1f2a44;text-align:center;padding:16px;transition:opacity .3s}
  #load.hide{opacity:0;pointer-events:none}
  #load h1{font:400 26px Georgia,serif;margin:0}
  #load p{margin:0;color:#6b7280;font-size:14px}
  #load a{color:#c9822b;font-weight:600}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid #e6dfd0;border-top-color:#c9822b;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <iframe id="app" title="KRS 2.0" allow="clipboard-write"></iframe>
  <div id="load">
    <div class="spin" aria-hidden="true"></div>
    <h1>KRS 2.0</h1>
    <p>Memuatkan sistem…</p>
    <p id="slow" hidden>Lambat? <a id="direct" target="_top">Buka terus di sini</a></p>
  </div>
  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyfu3ZOl5A0A_mZy2qqXIiIcCaifFmUalLKMjOfUrgkPBAHlhQEyQwst932x5Shn4qS/exec";
    var f = document.getElementById('app'), L = document.getElementById('load');
    document.getElementById('direct').href = APP_URL;
    f.onload = function(){ L.className = 'hide'; };
    f.src = APP_URL;
    setTimeout(function(){ document.getElementById('slow').hidden = false; }, 8000);
  </script>
</body>
</html>
